[project]
name = "cineflux-data-generator"
version = "0.1.0"
description = "Synthetic batch and streaming data generator for CineFlux."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "confluent-kafka[avro]>=2.8,<3",
    "faker>=35,<40",
    "minio>=7.2,<8",
    "numpy>=2.1,<3",
    "pyarrow>=22,<23",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
cineflux-data-generator = "generator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator"]

[dependency-groups]
dev = []
