[project]
name = "cineflux-flink-jobs"
version = "0.1.0"
description = "Kafka-to-PostgreSQL event-time processing jobs for CineFlux."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "apache-flink==1.20.5",
    "confluent-kafka>=2.8,<3",
    "fastavro>=1.12,<2",
    "pydantic>=2.10,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
cineflux-flink-jobs = "flink_jobs:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flink_jobs"]
